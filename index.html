function tone(freq,dur,type,vol,slide){
  if(!actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

function burst(x,y,n,ci,spd){
  var left=n;
  for(var i=0;i<SP_N && left>0;i++){
    var s=SP[i];
    if(s.life>0) continue;
    var a=(i*2.399+game.frame)*1.7;
    var sp=spd*(0.45+(i%5)*0.18);
    s.x=x; s.y=y;
    s.vx=Math.cos(a)*sp;
    s.vy=Math.sin(a)*sp-0.8;
    s.life=12+(i%7);
    s.max=s.life;
    s.ci=ci;
    s.sz=2+(i&1);
    left--;
  }
}

  }

  if(yes) beginQuest();

}

  if(game.picks[0]===game.picks[1]) cyclePick(1,1);

function noteMatch(winner){
  if(game.versus) return 0;
  if(game.boss || (F[1].def && F[1].def.name==='THE BOSS')) return 0;
  if(!F[1].isCpu || F[1].def.id!==0) return 0;
  if(winner!==0){
    game.gojoStreak=0;
    lsSet('crosscut_gojo_streak', 0);
    return 0;
  }
  if(game.diff!==2) return 0;

function pushDir(f){
  var x=0;
  if(f.inL) x--;
  if(f.inR) x++;
  var forward=x===f.face;
  var back=x===-f.face && x!==0;
  var d=0;
  if(f.inD && forward) d=3;
  else if(f.inD && back) d=5;
  else if(f.inD) d=1;
  else if(forward) d=2;
  else if(back) d=4;
  f.dirs[f.dirI]=d;
  f.dirI=(f.dirI+1)%24;
}
function qcf(f){
  var st=0;
  for(var age=20; age>=0; age--){
    var d=f.dirs[(f.dirI-1-age+240)%24];
    if(st===0){ if(d===1||d===3) st=1; }
    else if(st===1){
      if(d===3) st=2;
      else if(d===2) st=3;
      else if(d===1) st=1;
      else if(d!==0 && d!==5) st=0;
    } else if(st===2){
      if(d===2||d===3) st=3;
      else if(d===1) st=1;
      else if(d!==0) st=0;
    } else if(st===3){
      if(d===2) st=3;
      else if(d===1) st=0;
    }
  }
  return st===3;
}

function separate(){

  if(b.x>STAGE_R){ var k2=b.x-STAGE_R; b.x=STAGE_R; a.x-=k2; }
  if(b.x<STAGE_L) b.x=STAGE_L;
  if(a.x>STAGE_R) a.x=STAGE_R;

function consider(ai,di){

function applyHit(d,info){
  var a=F[info.owner];
  var away=d.x>=a.x?1:-1;
  var same=!info.proj || a.atkId===info.atkId;
  if(blocking(d, info.hgt)){
    if(d.state!=='blockstun') d.blockType=(d.state==='cblock'||d.inD)?1:0;
    d.state='blockstun';
    d.stun=info.bs;
    d.vx=away*info.push*0.55;
    d.vy=0;
    if(same){ a.vx=-away*info.push*0.28; a.didHit=1; a.combo=0; }
    burst(info.sx, info.sy, 5, 7, 2.1);
    tone(460,0.04,'triangle',0.035,200);
    if(info.shake) game.shake=Math.min(8, Math.max(game.shake, info.shake*0.4));
    game.hitstop=Math.max(game.hitstop, Math.min(4, info.stop||3));
    return;
  }
  var next=(game.frame-a.lastHitF<50 && a.combo>0)?a.combo+1:1;
  var dmg=info.dmg, stun=info.hs;
  if(next>=4){ dmg=Math.max(1,dmg-3); stun=Math.max(8,(stun*0.7)|0); }
  else if(next===3){ dmg=Math.max(1,dmg-1); stun=(stun*0.85)|0; }
  d.hp-=dmg; if(d.hp<0) d.hp=0;
  d.flash=6;
  d.vx=away*info.knock;
  d.vy=0;
  if(same) a.vx=-away*info.push*0.18;
  a.combo=next; a.comboT=46; a.lastHitF=game.frame;
  if(same) a.didHit=1;
  if(a.combo!==a.comboShown){ a.comboShown=a.combo; a.comboStr=a.combo+' HITS'; }
  burst(info.sx, info.sy, info.shake?10:6, a.def.spark, info.shake?3.1:2.1);
  if(d.hp<=0){
    d.state='ko'; d.timer=0; d.vy=-3.3; d.grounded=0;
    d.vx=away*(info.knock+1.6);
    game.hitstop=Math.max(game.hitstop, 12);
    game.shake=Math.min(8, Math.max(game.shake, 7));
    tone(96,0.32,'sawtooth',0.06,42);
  } else {
    d.state='hit'; d.stun=stun;
    game.hitstop=Math.max(game.hitstop, info.stop||3);
    if(info.shake) game.shake=Math.min(8, Math.max(game.shake, info.shake));
    tone(168,0.06,'square',0.045,70);
  }
}
function maybeEnd(){

  if(a.hp>0 && b.hp>0 && game.timeLeft>0) return;
  game.mode='ko';
  game.koT=0;
  var w=-1;
  if(a.hp>b.hp) w=0; else if(b.hp>a.hp) w=1;
  game.roundWinner=w;
  if(w>=0) game.wins[w]++;
  var timed=game.timeLeft<=0 && a.hp>0 && b.hp>0;
  if(w<0) game.koStr='DRAW';
  else if(timed) game.koStr='TIME';
  else game.koStr='K.O.';
  for(var i=0;i<2;i++){
    var f=F[i];

function update(){
  if(game.paused){
    if(game.mode!=='intro'&&game.mode!=='fight'&&game.mode!=='ko') game.paused=0;
    else {
      if(edge.Escape || (mdown && hitBox(RESUME_BOX))) game.paused=0;
      clearEdges();
      return;
    }
  }
  if((game.mode==='intro'||game.mode==='fight'||game.mode==='ko') && mdown && hitBox(PAUSE_BOX)){
    game.paused=1;
    clearEdges();
    return;
  }
  game.blink++;
  if(game.mode!=='menu' && game.mode!=='match' && game.mode!=='celebrate' && game.mode!=='champion' && game.mode!=='questask' && game.mode!=='questfail' && game.mode!=='questwin' && game.hitstop>0){
    if(edge.Escape && !game.quest){ game.mode='menu'; game.hitstop=0; clearEdges(); return; }
    game.hitstop--;
    for(var hf=0;hf<2;hf++) if(F[hf].flash>0) F[hf].flash--;
    updateSparks();
    if(game.shake>0){ game.shake*=0.82; if(game.shake<0.35) game.shake=0; }
    clearEdges();
    return;
  }
  game.frame++;
  if(game.mode==='menu'){ updateMenu(); clearEdges(); updateSparks(); return; }
  if(game.mode==='questask'){ updateQuestAsk(); clearEdges(); updateSparks(); return; }
  if(game.mode==='questfail'){
    game.questT++;
    if(game.questT>=150 || edge.Enter||edge.NumpadEnter||edge.Escape||mdown) game.mode='menu';
    clearEdges(); updateSparks(); return;
  }
  if(game.mode==='questwin'){
    if(edge.Enter||edge.NumpadEnter||mdown) game.mode='menu';
    clearEdges(); updateSparks(); return;
  }
  if(game.mode==='match'){
    game.matchT++;
    if(game.matchT>=300){
      game.mode='menu'; game.paused=0; game.hitstop=0; game.boss=0;
      var nBack=rosterCount();
      if(game.picks[1]>=nBack) game.picks[1]=game.picks[0]===0?1:0;
    }
    clearEdges(); updateSparks(); return;
  }
  if(game.mode==='champion'){
    game.champT++;
    F[0].victory=1;
    F[0].state='idle';
    F[0].mv=null; F[0].kind=''; F[0].mvKey='';
    if((game.champT%16)===1) spawnFirework(70+(game.champT*53)%820, 36+(game.champT*17)%150);
    if((game.champT%16)===9) spawnFirework(140+(game.champT*37)%700, 28+(game.champT*23)%120);
    updateFw();
    if(game.champT>=300){
      clearFw();
      game.mode='menu'; game.paused=0; game.hitstop=0; game.boss=0; game.champT=0;
      var nChamp=rosterCount();
      if(game.picks[1]>=nChamp) game.picks[1]=game.picks[0]===0?1:0;
    }
    clearEdges(); updateSparks(); return;
  }
  if(game.mode==='celebrate'){
    if(edge.Enter||edge.NumpadEnter||edge.Escape||mdown){
      game.mode='questask';
      game.hitstop=0;
      game.paused=0;
    }
    clearEdges(); updateSparks(); return;
  }
  if(edge.Escape && !game.quest){ game.mode='menu'; clearEdges(); return; }
  if(game.quest){
    game.versus=0;
    F[0].isCpu=0;
    F[1].isCpu=1;
    if(F[0].def.id!==4) F[0].def=ROSTER[4];
  }
  if(game.mode==='intro'){
    game.introT++;
    if(game.introT===58) tone(620,0.08,'square',0.04,460);
    if(game.introT>=92) game.mode='fight';
    updateFace(F[0],F[1]); updateFace(F[1],F[0]);
    clearEdges(); updateSparks(); return;
  }
  if(game.mode==='fight'){
    for(var i=0;i<2;i++){
      var f=F[i];
      if(f.isCpu) ai(f, F[1-i]);
      else if(!f.scripted) readHuman(f, MAP[i]);
      pushDir(f);
      if(!f.isCpu && !f.scripted && f.state!=='spec' && f.grounded && (edged(MAP[i].lp)||edged(MAP[i].hp)) && qcf(f)){
        f.buf.spec=10; f.buf.lp=0; f.buf.hp=0;
      }
    }
    if(game.timeLeft>0) game.timeLeft--;
    syncSec();
  } else {
    for(var j=0;j<2;j++){
      var g=F[j];
      g.inL=g.inR=g.inU=g.inD=g.inBlk=0;
      g.buf.lp=g.buf.hp=g.buf.lk=g.buf.hk=g.buf.spec=0;
    }
  }
  updateFighter(F[0]); updateFighter(F[1]);
  separate();
  clampF(F[0]); clampF(F[1]);
  updateFace(F[0],F[1]); updateFace(F[1],F[0]);
  setHurt(F[0]); setHurt(F[1]);
  pend[0].on=0; pend[1].on=0;
  if(game.mode==='fight'){
    consider(0,1); consider(1,0);
    updateProj();
    if(pend[0].on) applyHit(F[0], pend[0]);
    if(pend[1].on) applyHit(F[1], pend[1]);
    maybeEnd();
  } else {
    for(var p=0;p<PROJ_N;p++) PROJ[p].on=0;
  }
  for(var n=0;n<2;n++){
    var q=F[n];
    if(q.comboT>0) q.comboT--;
    if(q.flash>0) q.flash--;
    if(q.ghost>q.hp+0.15) q.ghost-=0.45; else q.ghost=q.hp;
  }
  if(game.mode==='ko'){
    game.koT++;
    if(game.koT>=115){
      if(game.wins[0]>=2||game.wins[1]>=2){
        var w=game.wins[0]>=2?0:1;
        if(game.quest){
          if(w!==0){
            game.quest=0;
            game.questOrder=null;
            game.paused=0;
            game.hitstop=0;
            game.mode='questfail';
            game.questT=0;
          } else if(!game.questOrder || game.questI+1>=game.questOrder.length){
            game.quest=0;
            game.questOrder=null;
            game.paused=0;
            game.hitstop=0;
            game.mode='questwin';
          } else {
            game.questI++;
            startMatch();
          }
        } else if(noteMatch(w)){
          game.mode='celebrate';
          game.hitstop=0;
        } else if(w===0 && F[1].isCpu && F[1].def && F[1].def.name==='THE BOSS'){
          game.mode='champion';
          game.champT=0;
          game.hitstop=0;
          game.paused=0;
          clearFw();
          F[0].victory=1;
          F[0].state='idle';
          F[0].mv=null; F[0].kind=''; F[0].mvKey=''; F[0].vx=0;
        } else {
          game.mode='match';
          game.matchT=0;
          game.winStr=F[w].def.name+' WINS';
          game.scoreStr=game.wins[0]+'  -  '+game.wins[1];
        }
      } else {
        game.roundIndex++;
        startRound();
      }
    }
  }
  if(game.shake>0){ game.shake*=0.82; if(game.shake<0.35) game.shake=0; }
  updateSparks();
  clearEdges();
}

function poseOf(f){
  if(f.state==='ko') return 7;
  if(f.state==='hit') return 6;
  if(f.state==='block'||f.state==='cblock'||f.state==='blockstun') return 5;
  if(f.state==='spec'){
    if(f.mv && f.timer<f.mv.su+f.suMod) return 11;
    return 8;
  }
  if(f.state==='atk'){
    var k=f.mvKey;
    if(k==='lk'||k==='hk'||k==='clk'||k==='chk'||k==='jhk') return 4;
    return 3;
  }
  if(!f.grounded||f.state==='air') return 9;
  if(f.victory&&(f.state==='idle'||f.state==='walk')) return 10;
  if(f.state==='crouch') return 2;
  if(f.state==='walk') return 1;
  return 0;
}

}

}
function drawMenu(){
  drawWorld();
  ctx.fillStyle='rgba(5,6,10,0.62)'; ctx.fillRect(0,0,W,H);
  txt('CROSSCUT', W/2, 36, FONT.title, 'center', '#f4f7ff', 'middle');
  txt('BEST OF THREE', W/2, 72, FONT.tiny, 'center', '#9eb0d0', 'middle');
  drawDiffChips();
  ctx.fillStyle='#ffd56a'; ctx.fillRect(748,86,168,28);
  txt('START', 832, 100, FONT.card, 'center', '#1a1408', 'middle');
  ctx.fillStyle='#241c18';
  ctx.fillRect(BOSS_BOX[0], BOSS_BOX[1], BOSS_BOX[2], BOSS_BOX[3]);
  ctx.strokeStyle='#c5ced6';
  ctx.lineWidth=2;
  ctx.strokeRect(BOSS_BOX[0]+1, BOSS_BOX[1]+1, BOSS_BOX[2]-2, BOSS_BOX[3]-2);
  txt('BOSS BATTLE', BOSS_BOX[0]+BOSS_BOX[2]/2, BOSS_BOX[1]+BOSS_BOX[3]/2, FONT.ui, 'center', '#eef2f6', 'middle');
  txt('OPTIONAL', BOSS_BOX[0]+BOSS_BOX[2]/2, BOSS_BOX[1]-8, FONT.tiny, 'center', '#9aa4bd', 'bottom');
  if(game.cooper){
    var qb=QUEST_BOX;
    ctx.fillStyle='#3a2a10';
    ctx.fillRect(qb[0],qb[1],qb[2],qb[3]);
    ctx.strokeStyle='#ffd76a';
    ctx.lineWidth=2;
    ctx.strokeRect(qb[0]+1,qb[1]+1,qb[2]-2,qb[3]-2);
    txt('QUEST', qb[0]+qb[2]/2, qb[1]+qb[3]/2, FONT.card, 'center', '#ffd76a', 'middle');
  }
  if(game.labA!==game.picks[0]||game.labB!==game.picks[1]||game.labV!==game.versus){
    game.labA=game.picks[0]; game.labB=game.picks[1]; game.labV=game.versus;
    game.labStr=ROSTER[game.labA].name+(game.versus?'   VS   P2  ':'   VS   CPU  ')+ROSTER[game.labB].name;
  }
  var nCard=rosterCount();
  var maxHp=1, maxWalk=1, maxDmg=0.1, si;
  for(si=0;si<nCard;si++){
    if(ROSTER[si].hp>maxHp) maxHp=ROSTER[si].hp;
    if(ROSTER[si].walk>maxWalk) maxWalk=ROSTER[si].walk;
    if(ROSTER[si].dmg>maxDmg) maxDmg=ROSTER[si].dmg;
  }
  var i, bg=['#121826','#102026','#241014','#241c10','#2a220c'];
  for(i=0;i<nCard;i++){
    var cb=cardBox(i), x=cb.x, y=cb.y, sel=game.picks[0]===i, opp=game.picks[1]===i;
    ctx.fillStyle=bg[i];
    ctx.fillRect(x,y,cb.w,cb.h);
    ctx.lineWidth=sel?4:opp?3:1;
    ctx.strokeStyle=sel?'#ffd56a':opp?BAR[i]:'#2a3144';
    ctx.strokeRect(x+1,y+1,cb.w-2,cb.h-2);
    txt(ROSTER[i].name, x+cb.w/2, y+16, ROSTER[i].name.length>11?FONT.ui:FONT.card, 'center', '#f4f7ff', 'middle');
    txt(ROSTER[i].title, x+cb.w/2, y+34, FONT.tiny, 'center', BAR[i], 'middle');
    if(game.cooper && i===4) txt('NEW', x+8, y+16, FONT.tiny, 'left', '#ffd76a', 'middle');
    if(sel) txt(game.versus?'P1':'YOU', x+cb.w-8, y+50, FONT.tiny, 'right', '#ffd56a', 'middle');
    else if(opp) txt(game.versus?'P2':'CPU', x+cb.w-8, y+50, FONT.tiny, 'right', BAR[i], 'middle');
    var pv=PREV[i];
    pv.x=0; pv.y=0; pv.face=1; pv.flash=0; pv.grounded=1; pv.blockType=0; pv.atkCrouch=0; pv.mv=null;
    pv.state='idle'; pv.victory=sel?1:0; pv.def=ROSTER[i];
    ctx.save();
    ctx.translate(x+cb.w/2, y+176);
    ctx.scale(cb.w<200?0.52:0.62, cb.w<200?0.52:0.62);
    drawFighter(pv);
    ctx.restore();
    txt(ROSTER[i].blurb, x+cb.w/2, y+206, FONT.tiny, 'center', '#d5deef', 'middle');
    txt('HP', x+12, y+226, FONT.tiny, 'left', '#9aa4bd', 'middle');
    txt('SPD', x+12, y+240, FONT.tiny, 'left', '#9aa4bd', 'middle');
    txt('DMG', x+12, y+254, FONT.tiny, 'left', '#9aa4bd', 'middle');
    var mw=Math.max(80, cb.w-70);
    meter(x+48, y+223, mw, ROSTER[i].hp/maxHp, BAR[i]);
    meter(x+48, y+237, mw, ROSTER[i].walk/maxWalk, BAR[i]);
    meter(x+48, y+251, mw, ROSTER[i].dmg/maxDmg, BAR[i]);
  }
  ctx.fillStyle='rgba(8,10,16,0.9)'; ctx.fillRect(20,392,920,132);
  txt(HELP_CPU, W/2, 414, FONT.tiny, 'center', '#d5deef', 'middle');
  txt(HELP1, W/2, 440, FONT.tiny, 'center', '#f4f7ff', 'middle');
  txt(HELP2, W/2, 462, FONT.tiny, 'center', '#f4f7ff', 'middle');
  txt(HELP3, W/2, 486, FONT.tiny, 'center', '#ffd59a', 'middle');
  if(!game.audio) txt('SOUND OFF  —  CLICK OR PRESS A KEY', W/2, 508, FONT.tiny, 'center', '#8ea0c0', 'middle');
  else txt(game.labStr, W/2, 508, FONT.tiny, 'center', '#c5d4ee', 'middle');
}

function draw(){
  if(!ctx) return;
  tint='';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#070814';
  ctx.fillRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(game.mode==='menu'){ drawMenu(); return; }
  if(game.mode==='questask'){ drawQuestAsk(); return; }
  if(game.mode==='questfail'){ drawQuestFail(); return; }
  if(game.mode==='questwin'){ drawQuestWin(); return; }
  var sh=!game.paused && game.shake>0.4?game.shake:0;
  var sx=sh?((game.blink&1)?sh:-sh):0;
  var sy=sh?((game.blink&2)?sh*0.35:-sh*0.35):0;
  if(game.mode==='champion'){
    var cu=game.champT<60?game.champT/60:1;
    var cz=1+cu*1.5;
    var cpx=F[0].x, cpy=F[0].y-F[0].def.tall*0.55;
    var camX=(1-cu)*sx+cu*(W*0.5-cpx*cz);
    var camY=(1-cu)*sy+cu*(H*0.62-cpy*cz);
    ctx.setTransform(cz,0,0,cz,camX,camY);
  } else ctx.setTransform(1,0,0,1,sx,sy);
  drawWorld();
  var a=0,b=1;
  if(F[0].x>F[1].x){ a=1; b=0; }
  drawFighter(F[a]); drawFighter(F[b]);
  drawProj();
  drawSparks();
  ctx.setTransform(1,0,0,1,0,0);
  drawHUD();
  if(game.mode==='celebrate') drawCelebrate();
  else if(game.mode==='champion') drawChampion();
  else drawBanner();
  if(game.paused) drawPaused();
  else if(game.mode==='intro'||game.mode==='fight'||game.mode==='ko') drawPauseBtn();
}
function loop(ts){
  if(!lastT){ lastT=ts; requestAnimationFrame(loop); return; }
  var d=ts-lastT; lastT=ts;
  if(d>80) d=80;
  acc+=d;
  var n=0;
  while(acc>=16.6667 && n<4){ update(); acc-=16.6667; n++; }
  draw();
  requestAnimationFrame(loop);
}
function onDown(e){
  if(e.repeat) return;
  var c=e.code;
  if(down[c]===undefined) return;
  if(!down[c]) edge[c]=1;
  down[c]=1;
  if(c==='ArrowLeft'||c==='ArrowRight'||c==='ArrowUp'||c==='ArrowDown'||c==='Space') e.preventDefault();
  unlock();
}
function onUp(e){ if(down[e.code]!==undefined) down[e.code]=0; }
function boot(){
  var canvas=document.getElementById('c');
  canvas.tabIndex=1;
  ctx=canvas.getContext('2d',{alpha:false});
  window.addEventListener('keydown', onDown);
  window.addEventListener('keyup', onUp);
  canvas.addEventListener('mousedown', function(e){
    unlock();
    canvas.focus();
    var r=canvas.getBoundingClientRect();
    if(r.width>0){
      mx=(e.clientX-r.left)*(W/r.width);
      my=(e.clientY-r.top)*(H/r.height);
      mdown=1;
    }
  });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  requestAnimationFrame(loop);
}
globalThis.CROSSCUT_TEST={
  update:update, game:game, F:F, ROSTER:ROSTER, SPEC:SPEC,
  noteMatch:noteMatch, beginQuest:beginQuest, cyclePick:cyclePick, cycleDiff:cycleDiff, setDiff:setDiff, outDmg:outDmg, cardBox:cardBox,
  startTest:function(a,b,bothCpu){
    game.picks[0]=a; game.picks[1]=b; game.versus=0;
    startMatch();
    if(bothCpu){ F[0].isCpu=1; F[1].isCpu=1; }
    F[0].scripted=0; F[1].scripted=0;
    game.mode='fight';
  },
  control:function(slot,o){
    var f=F[slot];
    f.isCpu=0; f.scripted=1;
    f.inL=o.l?1:0; f.inR=o.r?1:0; f.inU=o.u?1:0; f.inD=o.d?1:0; f.inBlk=o.blk?1:0;
    if(o.lp) f.buf.lp=10;
    if(o.hp) f.buf.hp=10;
    if(o.lk) f.buf.lk=10;
    if(o.hk) f.buf.hk=10;
    if(o.sp) f.buf.spec=10;
  }
};
if(typeof document!=='undefined') boot();
})();
</script>
