function tone(freq,dur,type,vol,slide){
  if(!actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

function startMatch(){
  if(game.quest){
    game.versus=0;
    game.picks[0]=4;
    var qn=game.questOrder&&game.questOrder.length?game.questOrder.length:0;
    var qi=game.questI|0;
    if(qi<0||qi>=qn) qi=0;
    game.questI=qi;
    game.picks[1]=qn?game.questOrder[qi]:0;
  }
  F[0].def=ROSTER[game.picks[0]];
  F[1].def=ROSTER[game.picks[1]];
  F[0].isCpu=0;
  F[1].isCpu=game.versus?0:1;
  F[0].scripted=0; F[1].scripted=0;
  game.wins[0]=0; game.wins[1]=0;
  game.roundIndex=1;
  startRound();
}
function beginQuest(){
  game.boss=0;
  var ids=[0,1,2,3];
  var i,j,tmp;
  for(i=3;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    tmp=ids[i]; ids[i]=ids[j]; ids[j]=tmp;
  }
  game.questOrder=ids;
  game.questI=0;
  game.quest=1;
  game.paused=0;
  game.versus=0;
  game.picks[0]=4;
  game.picks[1]=ids[0];
  tone(520,0.06,'square',0.04,360);
  startMatch();
}
function updateQuestAsk(){
  var yes=edge.Enter||edge.NumpadEnter||edge.KeyY;
  var no=edge.KeyN||edge.Escape;
  if(mdown){
    yes=hitBox(YES_BOX)?1:0;
    no=hitBox(NO_BOX)?1:0;

  if(yes) beginQuest();
  else if(no){ game.quest=0; game.paused=0; game.mode='menu'; }
}
function tryStart(){
  game.boss=0;

  if(game.picks[0]>=n) game.picks[0]=0;
  if(game.picks[1]>=n) game.picks[1]=n>1?1:0;
  if(game.picks[0]===game.picks[1]) cyclePick(1,1);
  tone(520,0.06,'square',0.04,360);
  startMatch();

function startBoss(){
  var bi=-1, i;
  for(i=0;i<ROSTER.length;i++) if(ROSTER[i].name==='THE BOSS') bi=i;
  if(bi<0) return;
  var n=rosterCount();
  if(game.picks[0]<0||game.picks[0]>=n) game.picks[0]=0;
  game.picks[1]=bi;
  game.versus=0;
  game.quest=0;
  game.boss=1;

  tone(160,0.1,'sawtooth',0.05,48);
  startMatch();

function noteMatch(winner){
  if(game.versus) return 0;
  if(game.boss || (F[1].def && F[1].def.name==='THE BOSS')) return 0;
  if(!F[1].isCpu || F[1].def.id!==0) return 0;
  if(winner!==0){
    game.gojoStreak=0;
    lsSet('crosscut_gojo_streak', 0);
    return 0;
  }
  if(game.diff!==2) return 0;
  game.gojoStreak=(game.gojoStreak||0)+1;
  lsSet('crosscut_gojo_streak', game.gojoStreak);
  if(game.gojoStreak>=2 && !game.cooper){
    game.cooper=1;
    lsSet('crosscut_cooper', 1);
    return 1;
  }
  return 0;
}
