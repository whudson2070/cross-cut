<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CROSSCUT</title>
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%}
canvas{display:block;width:100vw;height:100vh;background:#05060a;touch-action:none;outline:none}
#fsbtn{
  position:fixed; z-index:6; top:max(6px, env(safe-area-inset-top)); left:max(6px, env(safe-area-inset-left));
  min-height:44px; padding:10px 12px; border:2px solid #fff6d0; border-radius:10px;
  background:#ffd56a; color:#1a1408; font:700 13px/1 Segoe UI, Arial, sans-serif;
  letter-spacing:0.04em; touch-action:manipulation; cursor:pointer;
}
#touchui{
  position:fixed; z-index:4; left:0; right:0; bottom:0; pointer-events:none;
  display:flex; justify-content:space-between; align-items:flex-end;
  padding:0 max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  box-sizing:border-box;
}
#touchui[hidden]{display:none !important}
.cluster{pointer-events:none; display:flex; flex-direction:column; gap:8px; width:min(44vw, 300px)}
.cluster.right{width:min(52vw, 420px)}
.row{display:flex; gap:8px; width:100%}
#touchui button{
  pointer-events:auto; touch-action:none; flex:1; min-width:0; min-height:56px;
  border:2px solid rgba(255,255,255,0.38); border-radius:14px;
  background:rgba(10,14,24,0.78); color:#f4f7ff;
  font:700 12px/1.05 Segoe UI, Arial, sans-serif; padding:4px 2px; cursor:pointer;
}
#touchui button.wide{width:68%; align-self:center; flex:none}
#touchui button.on{background:#ffd56a; color:#1a1408; border-color:#fff6d0}
#touchui button[data-act="blk"]{background:rgba(22,70,48,0.88)}
#touchui button[data-act="sp"]{background:rgba(90,28,40,0.88)}
#touchui button[data-act="blk"].on,#touchui button[data-act="sp"].on{background:#ffd56a; color:#1a1408}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<button id="fsbtn" type="button">FULLSCREEN</button>
<div id="touchui" hidden>
  <div class="cluster left">
    <button type="button" class="wide" data-act="u">JUMP</button>
    <div class="row">
      <button type="button" data-act="l">LEFT</button>
      <button type="button" data-act="r">RIGHT</button>
    </div>
    <button type="button" class="wide" data-act="d">CROUCH</button>
  </div>
  <div class="cluster right">
    <div class="row">
      <button type="button" data-act="lp">LIGHT<br>PUNCH</button>
      <button type="button" data-act="hp">HEAVY<br>PUNCH</button>
      <button type="button" data-act="blk">BLOCK</button>
    </div>
    <div class="row">
      <button type="button" data-act="lk">LIGHT<br>KICK</button>
      <button type="button" data-act="hk">HEAVY<br>KICK</button>
      <button type="button" data-act="sp">SPECIAL</button>
    </div>
  </div>
</div>
