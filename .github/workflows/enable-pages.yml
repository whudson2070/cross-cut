name: enable-pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try create; if already exists, update
          set +e
          RESP=$(gh api --method POST /repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f source[branch]=main \
            -f source[path]=/ 2>&1)
          CODE=$?
          echo "$RESP"
          if echo "$RESP" | grep -qi 'already exists\|Conflict\|422'; then
            gh api --method PUT /repos/${{ github.repository }}/pages \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/
          elif [ $CODE -ne 0 ]; then
            # Fallback: pages/write via Actions deployment style
            gh api --method PUT /repos/${{ github.repository }}/pages \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/ || exit 1
          fi
          gh api /repos/${{ github.repository }}/pages
